name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
      TESTINGPLATFORM_TELEMETRY_OPTOUT: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - name: Restore
        run: dotnet restore Orleans.Dataflow.slnx --configfile NuGet.Config
      - name: Build
        run: dotnet build Orleans.Dataflow.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test Orleans.Dataflow.slnx --no-build --no-restore --configuration Release
      # Tiny sizes, one run of everything, and nothing asserted about timing: what this step checks is that
      # every benchmark scenario — including the one that deploys a cluster and kills a silo — still runs to
      # completion, which is the only way a harness nobody runs on a schedule does not quietly rot. The
      # harness exits non-zero when a scenario fails, so no extra assertion is needed here.
      - name: Benchmark smoke
        run: dotnet run --project benchmarks/Orleans.Dataflow.Benchmarks/Orleans.Dataflow.Benchmarks.csproj --no-build --no-restore --configuration Release -- --smoke
      # The smallest sizes that still exercise every scenario, including the one that stands up a silo:
      # what this step checks is that the samples still run and that each scenario's two authorings — one
      # C#, one F# — still build byte-identical documents, which is the claim the samples exist to make.
      # A sample nobody runs on a schedule rots faster than anything else in a repository, and this one
      # would rot silently, because a drifting frontend still compiles. The application exits non-zero when
      # a scenario fails or when a pair disagrees, so no extra assertion is needed here.
      - name: Samples smoke
        run: dotnet run --project samples/Orleans.Dataflow.Samples/Orleans.Dataflow.Samples.csproj --no-build --no-restore --configuration Release -- --smoke
